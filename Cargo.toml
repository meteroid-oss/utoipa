[workspace.package]
rust-version = "1.88"

[workspace]
resolver = "2"
members = [
    "utoipa",
    "utoipa-gen",
    "utoipa-swagger-ui-vendored",
    "utoipa-swagger-ui",
    "utoipa-redoc",
    "utoipa-rapidoc",
    "utoipa-scalar",
    "utoipa-axum",
    "utoipa-config",
    "utoipa-actix-web",
]

# Crates published to crates.io under the meteroid-oss fork, in dependency order.
# Only these three carry the fork's custom features (e.g. `tagged_discriminator`);
# the remaining workspace members are kept building locally but are not published.
[workspace.metadata.publish]
order = [
    "meteroid-utoipa-config",
    "meteroid-utoipa-gen",
    "meteroid-utoipa",
]
