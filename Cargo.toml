[workspace.package]
rust-version = "1.88"

[workspace]
resolver = "2"
members = [
    "utoipa",
    "utoipa-gen",
    "utoipa-swagger-ui-vendored",
    "utoipa-swagger-ui",
    "utoipa-redoc",
    "utoipa-rapidoc",
    "utoipa-scalar",
    "utoipa-axum",
    "utoipa-config",
    "utoipa-actix-web",
]

# Crates published to crates.io under the meteroid-oss fork, in dependency order.
# The core three (`-config`, `-gen`, `meteroid-utoipa`) carry the fork's custom
# features (e.g. `tagged_discriminator`); `-axum` and `-scalar` are the framework
# bindings consumed downstream. The remaining workspace members are kept building
# locally but are not published.
[workspace.metadata.publish]
order = [
    "meteroid-utoipa-config",
    "meteroid-utoipa-gen",
    "meteroid-utoipa",
    "meteroid-utoipa-axum",
    "meteroid-utoipa-scalar",
]
