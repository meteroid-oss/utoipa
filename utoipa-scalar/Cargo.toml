[package]
name = "meteroid-utoipa-scalar"
description = "Scalar for utoipa (meteroid-oss fork of utoipa-scalar)"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["scalar", "openapi", "documentation"]
repository = "https://github.com/meteroid-oss/utoipa"
categories = ["web-programming"]
authors = ["Juha Kukkonen <juha7kukkonen@gmail.com>"]
rust-version.workspace = true

# Published as `meteroid-utoipa-scalar` but keeps the `utoipa_scalar` lib name so
# downstream code stays `use utoipa_scalar::...` as a drop-in with upstream.
[lib]
name = "utoipa_scalar"

[package.metadata.docs.rs]
features = ["actix-web", "axum", "rocket"]
rustdoc-args = ["--cfg", "doc_cfg"]

[features]
# Pull capped `time` with rocket so cookie 0.18.1 cannot resolve time 0.3.52+.
rocket = ["dep:rocket", "dep:time"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
utoipa = { package = "meteroid-utoipa", version = "6.0.0", path = "../utoipa", default-features = false, features = [
    "macros",
] }
actix-web = { version = "4", optional = true, default-features = false }
rocket = { version = "0.5", features = ["json"], optional = true }
time = { workspace = true, optional = true }
axum = { version = "0.8.4", default-features = false, optional = true }

[dev-dependencies]
utoipa-scalar = { package = "meteroid-utoipa-scalar", path = ".", features = ["actix-web", "axum", "rocket"] }

[lints]
workspace = true
