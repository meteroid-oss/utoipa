[package]
name = "meteroid-utoipa-axum"
description = "Utoipa's axum bindings for seamless integration for the two (meteroid-oss fork of utoipa-axum)"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["utoipa", "axum", "bindings"]
repository = "https://github.com/meteroid-oss/utoipa"
categories = ["web-programming"]
authors = ["Juha Kukkonen <juha7kukkonen@gmail.com>"]
rust-version.workspace = true
include = [
    "README.md",
    "src/**/*.rs",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "CHANGELOG.md",
    "Cargo.toml",
]

# Published as `meteroid-utoipa-axum` but keeps the `utoipa_axum` lib name so
# downstream code stays `use utoipa_axum::...` as a drop-in with upstream.
[lib]
name = "utoipa_axum"

[features]
debug = []

[dependencies]
axum = { version = "0.8.4", default-features = false }
utoipa = { package = "meteroid-utoipa", version = "5.0.0", path = "../utoipa", default-features = false, features = [
    "macros",
] }
tower-service = "0.3"
tower-layer = "0.3.3"
pastey = "0.2"

[dev-dependencies]
utoipa = { package = "meteroid-utoipa", path = "../utoipa", features = ["debug"] }
axum = { version = "0.8.4", default-features = false, features = ["json"] }
http = "1.4"
insta = { version = "1.47", features = ["json"] }
serde = "1"
tokio = { version = "1.52", features = ["macros", "rt"]}
tower = "0.5"

[package.metadata.docs.rs]
features = []
rustdoc-args = ["--cfg", "doc_cfg"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(doc_cfg)'] }
