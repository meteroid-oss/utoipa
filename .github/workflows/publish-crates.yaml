name: Publish crates

# Publishes the meteroid-oss fork crates to crates.io in dependency order:
#   meteroid-utoipa-config -> meteroid-utoipa-gen -> meteroid-utoipa
# The order comes from [workspace.metadata.publish].order in the root Cargo.toml.
#
# How to cut a release (managed via GitHub Releases):
#   1. Bump the version(s) of whatever changed in the crate Cargo.toml files and
#      merge to the default branch. The versions published come from Cargo.toml,
#      not from the tag name.
#   2. GitHub -> Releases -> Draft a new release -> choose a tag matching the
#      meteroid-utoipa version (e.g. v5.6.0, created on publish) -> Publish.
#
# The tag is only a trigger: each crate whose version is already on crates.io is
# skipped, so only the crates you bumped are published, and re-running a failed
# release is safe.
#
# Note: `release`-triggered workflows run from the copy of this file on the
# DEFAULT branch, so this must be merged to master to fire on a release. You can
# also run it by hand (Actions -> Run workflow) with an optional dry-run.
#
# Requires a `CARGO_REGISTRY_TOKEN` repository secret: a crates.io API token with
# publish scope (crates.io -> Account Settings -> API Tokens).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package & verify only, do not upload to crates.io"
        type: boolean
        default: false

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "${DRY_RUN}" != "true" && -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          metadata=$(cargo metadata --format-version=1 --no-deps)
          publish_order=$(jq -r '.metadata.publish.order[]' <<<"$metadata")

          # The release tag is only a trigger; the versions published come from
          # Cargo.toml. Warn (don't fail) if the tag doesn't match the headline
          # meteroid-utoipa version, which usually means a forgotten version bump.
          if [[ -n "${RELEASE_TAG:-}" ]]; then
            headline=$(jq -r '.packages[] | select(.name == "meteroid-utoipa") | .version' <<<"$metadata")
            tag_ver=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?' <<<"$RELEASE_TAG" | head -1 || true)
            if [[ -n "$tag_ver" && "$tag_ver" != "$headline" ]]; then
              echo "::warning::Release tag '$RELEASE_TAG' does not match meteroid-utoipa version '$headline' in Cargo.toml. The tag only triggers the run; published versions come from Cargo.toml."
            fi
          fi

          # Returns 0 if $1@$2 is already on the crates.io sparse index. We query the
          # index (what cargo itself resolves against) rather than the web API, which
          # can rate-limit or reject on User-Agent policy and give a false "missing"
          # that makes us try to re-publish an existing version.
          is_published() {
            local name="$1" ver="$2" prefix="${1:0:2}/${1:2:2}"
            curl -sSf "https://index.crates.io/${prefix}/${name}" 2>/dev/null \
              | grep -qF "\"vers\":\"${ver}\""
          }

          published=0
          for crate in $publish_order; do
            version=$(jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' <<<"$metadata")
            echo "::group::$crate v$version"

            # Idempotent fast-path: skip versions already live on the index.
            if is_published "$crate" "$version"; then
              echo "$crate $version is already published, skipping."
              echo "- \`$crate\` \`$version\` — already published (skipped)" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            flags=(-p "$crate")
            [[ "$DRY_RUN" == "true" ]] && flags+=(--dry-run)

            # cargo (>=1.66) blocks until the crate is queryable in the index, so the
            # next dependent crate can resolve it. Retry to ride out transient hiccups,
            # but treat "already published" as success: re-publishing a version is never
            # retryable, and the pre-check can race a concurrent or just-finished publish.
            attempt=1
            max=5
            skipped=""
            while true; do
              if out=$(cargo publish "${flags[@]}" 2>&1); then
                printf '%s\n' "$out"
                break
              fi
              printf '%s\n' "$out"
              if grep -qiE "already (exists|uploaded)" <<<"$out"; then
                echo "$crate $version is already published, skipping."
                skipped=1
                break
              fi
              if [[ $attempt -ge $max ]]; then
                echo "::error::Failed to publish $crate after $max attempts."
                exit 1
              fi
              wait=$((attempt * 15))
              echo "publish failed; retry $attempt/$max after ${wait}s..."
              sleep "$wait"
              attempt=$((attempt + 1))
            done

            if [[ -n "$skipped" ]]; then
              echo "- \`$crate\` \`$version\` — already published (skipped)" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$DRY_RUN" == "true" ]]; then
              echo "- \`$crate\` \`$version\` — dry-run OK" >> "$GITHUB_STEP_SUMMARY"
              published=$((published + 1))
            else
              echo "- \`$crate\` \`$version\` — published" >> "$GITHUB_STEP_SUMMARY"
              published=$((published + 1))
            fi
            echo "::endgroup::"
          done

          if [[ "$published" -eq 0 && "$DRY_RUN" != "true" ]]; then
            echo "::notice::Nothing published — every crate version is already on crates.io. Did you bump the Cargo.toml version(s)?"
          fi
