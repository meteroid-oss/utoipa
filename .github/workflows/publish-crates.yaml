name: Publish crates

# Publishes the meteroid-oss fork crates to crates.io in dependency order:
#   meteroid-utoipa-config -> meteroid-utoipa-gen -> meteroid-utoipa
# The order comes from [workspace.metadata.publish].order in the root Cargo.toml.
#
# How to cut a release (managed via GitHub Releases):
#   1. Bump the version(s) of whatever changed in the crate Cargo.toml files and
#      merge to the default branch. Versions come from Cargo.toml, not the tag.
#   2. GitHub -> Releases -> Draft a new release -> choose a tag (created on
#      publish, e.g. v5.5.1) -> Publish. That fires this workflow.
# Each crate whose version is already on crates.io is skipped, so only the crates
# you actually bumped are published, and re-running a failed release is safe.
#
# Note: `release`-triggered workflows run from the copy of this file on the
# DEFAULT branch, so this must be merged to master to take effect. You can also
# run it by hand (Actions -> Run workflow) with an optional dry-run.
#
# Requires a `CARGO_REGISTRY_TOKEN` repository secret: a crates.io API token with
# publish scope (crates.io -> Account Settings -> API Tokens).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package & verify only, do not upload to crates.io"
        type: boolean
        default: false

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          if [[ "${DRY_RUN}" != "true" && -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          metadata=$(cargo metadata --format-version=1 --no-deps)
          publish_order=$(jq -r '.metadata.publish.order[]' <<<"$metadata")

          published=0
          for crate in $publish_order; do
            version=$(jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' <<<"$metadata")
            echo "::group::$crate v$version"

            # Idempotent: skip versions already live on crates.io.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${crate}/${version}" || echo "000")
            if [[ "$code" == "200" ]]; then
              echo "$crate $version is already published, skipping."
              echo "- \`$crate\` \`$version\` — already published (skipped)" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            flags=(-p "$crate")
            [[ "$DRY_RUN" == "true" ]] && flags+=(--dry-run)

            # cargo (>=1.66) blocks until the crate is queryable in the index, so the
            # next dependent crate can resolve it. Retry to ride out transient hiccups.
            attempt=1
            max=5
            until cargo publish "${flags[@]}"; do
              if [[ $attempt -ge $max ]]; then
                echo "::error::Failed to publish $crate after $max attempts."
                exit 1
              fi
              wait=$((attempt * 15))
              echo "publish failed; retry $attempt/$max after ${wait}s..."
              sleep "$wait"
              attempt=$((attempt + 1))
            done

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- \`$crate\` \`$version\` — dry-run OK" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$crate\` \`$version\` — published" >> "$GITHUB_STEP_SUMMARY"
            fi
            published=$((published + 1))
            echo "::endgroup::"
          done

          if [[ "$published" -eq 0 && "$DRY_RUN" != "true" ]]; then
            echo "::notice::Nothing published — every crate version is already on crates.io. Did you bump the Cargo.toml version(s)?"
          fi
